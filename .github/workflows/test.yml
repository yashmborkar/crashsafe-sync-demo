name: PostgreSQL integration tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crashsafe
          POSTGRES_DB: crashsafe_demo_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U crashsafe -d crashsafe_demo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://crashsafe@localhost:5432/crashsafe_demo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
