services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crashsafe
      POSTGRES_DB: crashsafe_demo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "crashsafe", "-d", "crashsafe_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  demo-db:
